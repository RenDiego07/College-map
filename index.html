<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo de Buses ESPOL</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Diseño general: Flexbox para dividir mapa (arriba) y menú (abajo) */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
        }

        /* El mapa toma todo el espacio disponible sobrante */
        #mi-mapa { 
            flex: 1; 
            width: 100%; 
            z-index: 1; 
        }

        /* Estilos del contenedor del menú inferior */
        #menu-inferior {
            height: 35vh; /* Lo amplié un poquito al 35% para que se vean mejor las 2 listas */
            background-color: white;
            overflow-y: auto; 
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* Estilos para los títulos de cada sección */
        .titulo-seccion {
            background-color: #e6f2f7; /* Un azul muy clarito de fondo */
            color: #0078A8;
            margin: 0;
            padding: 10px 20px;
            font-size: 1.1em;
            border-bottom: 2px solid #cce4ee;
            position: sticky; /* Hace que el título se quede fijo al hacer scroll */
            top: 0;
            z-index: 5;
        }

        /* Estilos de la lista y los ítems */
        .lugar-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }

        .lugar-item:hover {
            background-color: #f9f9f9;
        }

        .lugar-info h3 {
            margin: 0 0 5px 0;
            color: #333;
            font-size: 1.1em;
        }

        .lugar-info p {
            margin: 0;
            color: #666;
            font-size: 0.85em;
        }

        /* Estilos del botón con ícono */
        .btn-ir {
            background-color: #0078A8;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            min-width: 90px;
            justify-content: center;
        }

        .btn-ir:hover {
            background-color: #005b80;
        }
    </style>
</head>
<body>

    <div id="mi-mapa"></div>

    <div id="menu-inferior">
        
        <h2 class="titulo-seccion">🚍 Punto de Ida</h2>
        <div id="lista-ida"></div>
        
        <h2 class="titulo-seccion">🚌 Punto de Retorno</h2>
        <div id="lista-vuelta"></div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Inicializar el mapa centrado en ESPOL
        const mapa = L.map('mi-mapa').setView([-2.1460, -79.9650], 15);

        // Cargar mapa base
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(mapa);

        // --- ARREGLO 1: RUTAS DE IDA ---
        const rutasIda = [
            { nombre: "Estación de buses", lat: -2.1442635267096355, lng: -79.96568978977587, descripcion: "Estación de transporte público." },
            { nombre: "Parada Gimnasio Bienestar", lat: -2.1436773286435367, lng: -79.96781619764165, descripcion: "Parada de interno." },
            { nombre: "Paradero FCSH", lat: -2.147474886098651, lng: -79.96814341867588, descripcion: "Parada de interno." },
            { nombre: "Paradero Biblioteca", lat: -2.1486696425003378, lng: -79.9648544974793, descripcion: "Parada de interno." },
            { nombre: "Paradero FCV", lat: -2.1515425952864815, lng: -79.95766035606196, descripcion: "Parada de interno." },
            { nombre: "Paradero Garita", lat: -2.151986473334339, lng: -79.95271304123973, descripcion: "Parada de interno." },
            { nombre: "Centro de Tecnología en Información", lat: -2.1458152284082095, lng: -79.94835659268176, descripcion: "Parada de interno." },
            { nombre: "Paradero FADCOM", lat: -2.1443139419464257, lng: -79.96229688573032, descripcion: "Parada de interno." }
        ];

        // --- ARREGLO 2: RUTAS DE RETORNO ---
        const rutasVuelta = [
            { nombre: "Paradero Biblioteca", lat: -2.1486774630588266, lng: -79.96448365785928, descripcion: "Parada de interno." },
            { nombre: "Paradero FCV/Piscina", lat: -2.1517444031666835, lng: -79.95789539782366, descripcion: "Parada de interno." },
            { nombre: "Paradero FCSH", lat: -2.147523111466108, lng: -79.96835718370146, descripcion: "Parada de interno." },
            { nombre: "Paradero FIEC", lat: -2.14450208655603, lng: -79.96804660776182, descripcion: "Parada de interno." },
            { nombre: "Paradero Garita", lat: -2.1524057475753575, lng: -79.9531264523259, descripcion: "Parada de interno." }
        ];

        // Unimos los dos arreglos solo para poder saber el lugar seleccionado al hacer clic
        const lugaresGlobales = [...rutasIda, ...rutasVuelta];
        const marcadoresGuardados = [];

        // Función para renderizar los menús y marcadores automáticamente
        // "offset" nos ayuda a saber qué número de índice global tiene cada botón
        function generarMenuYMarcadores(listaLugares, idContenedorHTML, offsetIndices) {
            const contenedor = document.getElementById(idContenedorHTML);

            listaLugares.forEach((lugar, indiceLocal) => {
                const indiceGlobal = offsetIndices + indiceLocal; // Para que la función volarHacia sepa cuál elegir

                // 1. Crear el marcador en el mapa
                const marcador = L.marker([lugar.lat, lugar.lng]).addTo(mapa);
                marcador.bindPopup(`<strong>${lugar.nombre}</strong><br>${lugar.descripcion}`);
                marcadoresGuardados.push(marcador);

                // 2. Crear el elemento HTML en la lista
                const divLugar = document.createElement('div');
                divLugar.className = 'lugar-item';
                
                divLugar.innerHTML = `
                    <div class="lugar-info">
                        <h3>${lugar.nombre}</h3>
                        <p>${lugar.descripcion}</p>
                    </div>
                    <button class="btn-ir" onclick="volarHacia(${indiceGlobal})">
                        📍 Ir ahí
                    </button>
                `;
                
                contenedor.appendChild(divLugar);
            });
        }

        // Ejecutamos la función para generar ambas listas
        // Para "Ida" empezamos a contar desde 0
        generarMenuYMarcadores(rutasIda, 'lista-ida', 0);
        
        // Para "Retorno" empezamos a contar desde donde terminó la lista de Ida
        generarMenuYMarcadores(rutasVuelta, 'lista-vuelta', rutasIda.length);

        // Función que se ejecuta al hacer clic en el botón "Ir ahí"
        function volarHacia(indiceGlobal) {
            const lugarSeleccionado = lugaresGlobales[indiceGlobal];
            const marcadorSeleccionado = marcadoresGuardados[indiceGlobal];

            // Vuelo hacia las coordenadas
            mapa.flyTo([lugarSeleccionado.lat, lugarSeleccionado.lng], 17, {
                duration: 1.5
            });

            // Abrir popup
            setTimeout(() => {
                marcadorSeleccionado.openPopup();
            }, 1500); 
        }
    </script>
</body>
</html>
